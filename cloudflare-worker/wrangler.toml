name = "velour-gemini-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

# Environment variables are set in the Cloudflare dashboard
# (Workers → velour-gemini-proxy → Settings → Variables)
# Mark GEMINI_API_KEY as a Secret (encrypted at rest)
#
# Required variables:
#   GEMINI_API_KEY      — your Gemini API key (Secret)
#   FIREBASE_PROJECT_ID — your Firebase project ID (plain text)
#   ALLOWED_ORIGIN      — your app's URL (plain text)

[observability]
enabled = true
